[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
elysia_perp = "6Q6A6yRtTh9EyANQdcFqXUn9zBCgMayyvTojnC2cRFWy"

[programs.devnet]
elysia_perp = "6Q6A6yRtTh9EyANQdcFqXUn9zBCgMayyvTojnC2cRFWy"

[programs.mainnet]
elysia_perp = "6Q6A6yRtTh9EyANQdcFqXUn9zBCgMayyvTojnC2cRFWy"

[registry]
url = "https://api.apr.dev"

# Per-developer, NOT per-repo. Left on the Anchor defaults so a fresh clone runs
# `anchor test` against a local validator without editing anything. Deploy to a
# real cluster with explicit flags instead of committing someone's home path:
#
#   anchor deploy --provider.cluster devnet \
#     --provider.wallet ~/.config/solana/elysia-devnet.json
#
# or export ANCHOR_PROVIDER_URL / ANCHOR_WALLET.
[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
